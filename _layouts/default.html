<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body>
    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper page-wrap">
        <div class="page-main">
          {{ content }}
        </div>
        {% if page.url == "/" %}
        <div class="page-sidebar">
          {% include month-calendar.html %}
        </div>
        {% endif %}
      </div>
    </main>

    {%- include footer.html -%}
  </body>
</html>
